<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Scanner</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff1f5, #f7e8ff);
    }
    .card {
      width: 100%;
      max-width: 430px;
      background: #fff;
      border-radius: 26px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 18px 50px rgba(0,0,0,.12);
    }
    h1 { margin: 4px 0 8px; font-size: 28px; }
    p { color: #666; margin: 0 0 20px; }
    #reader { width: 100%; overflow: hidden; border-radius: 18px; }
    #result {
      margin-top: 18px;
      padding: 12px;
      border-radius: 12px;
      background: #f6f6f6;
      color: #333;
      word-break: break-word;
      min-height: 20px;
    }
    button {
      margin-top: 14px;
      border: 0;
      border-radius: 999px;
      padding: 13px 22px;
      background: #111;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    .note { font-size: 12px; color: #999; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Scan QR</h1>
    <p>Camera ko QR code par point karo.</p>

    <div id="reader"></div>
    <div id="result">Waiting for QR code…</div>

    <button id="openBtn" style="display:none;" onclick="openResult()">
      Open scanned link
    </button>

    <div class="note">Camera permission allow karna hoga.</div>
  </div>

  <script>
    let scannedText = "";

    function onScanSuccess(decodedText) {
      scannedText = decodedText;
      document.getElementById("result").textContent = decodedText;
      document.getElementById("openBtn").style.display = "inline-block";
    }

    function onScanFailure(error) {
      // Keep scanning silently.
    }

    const scanner = new Html5QrcodeScanner(
      "reader",
      { fps: 10, qrbox: { width: 250, height: 250 } },
      false
    );

    scanner.render(onScanSuccess, onScanFailure);

    function openResult() {
      if (scannedText) {
        window.open(scannedText, "_blank");
      }
    }
  </script>
</body>
</html>

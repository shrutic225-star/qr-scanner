<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Voice Message</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff1f5, #f3e8ff);
    }

    .card {
      width: 85%;
      max-width: 380px;
      background: white;
      padding: 30px 20px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.12);
    }

    .icon {
      font-size: 55px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 10px 0;
      font-size: 26px;
    }

    p {
      color: #777;
      margin-bottom: 25px;
    }

    audio {
      width: 100%;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="icon">💌</div>

    <h1>Voice Message For You</h1>

    <p>Someone left you a little message 🎧</p>

    <audio controls>
      <source
        src="https://drive.google.com/uc?export=download&id=1UvRXCIhvEK1LGzWSou8LFztPIgHJotyx"
        type="audio/mp4">
      Your browser does not support audio.
    </audio>

  </div>

</body>
</html>
